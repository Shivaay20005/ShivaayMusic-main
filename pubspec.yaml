name: shivaaymusic
description: A cross platform app for music streaming.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.9+14

environment:
  sdk: ">=3.1.5 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  animations: ^2.0.11
  app_links: ^3.5.1
  archive: ^3.1.6
  audio_service: ^0.18.17
  audio_service_mpris: ^0.1.5
  audio_video_progress_bar: ^2.0.3
  audiotags: ^1.4.1
  buttons_tabbar: ^1.3.13
  cached_network_image: ^3.4.0
  dio: ^5.7.0
  file_picker: ^8.0.6
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  flutter:
    sdk: flutter
  flutter_keyboard_visibility: ^6.0.0
  flutter_lyric: ^2.0.4+6
  flutter_slidable: ^3.1.2
  get: ^4.7.1
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.6
  # NOTE: hosted 0.2.2 extends IconData, which is a final class in recent
  # Flutter (fails compilation). v0.2.3 fixed it and renamed constants from
  # snake_case to camelCase (app call sites were migrated accordingly).
  ionicons:
    git:
      url: https://github.com/ez-connect/flutter-ionicons.git
      ref: v0.2.3
  jni: ^0.14.0
  just_audio: ^0.9.46
  # NOTE: personal git fork was deleted; using the official pub.dev release
  # (app only uses the JustAudioMediaKit.title / protocolWhitelist statics).
  just_audio_media_kit: ^2.0.0
  # just_audio_media_kit does not pull the native libmpv bundles itself, so
  # these must be declared directly or Windows/Linux audio silently fails.
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  local_auth: ^2.3.0
  # `http` is used by the extraction client in `stream_service.dart` to stop
  # youtube_explode's retry loop on a rate limit. It is already a transitive
  # dependency of youtube_explode_dart, so this only makes the import explicit.
  http: ^1.0.0
  palette_generator: ^0.3.3+4
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  share_plus: ^10.1.4
  speech_to_text: ^7.0.0
  package_info_plus: 8.0.2
  wakelock_plus: ^1.3.3
  shimmer: ^3.0.0
  smtc_windows: ^0.1.2
  # NOTE: personal fork was deleted; the user's fork tracked this upstream.
  terminate_restart:
    git:
      url: https://github.com/sleem2012/terminate_restart.git
      ref: 5bab101a661e953b0d28a66ddce469779cf8dea0
  toggle_switch: ^2.1.0
  tray_manager: ^0.2.3
  url_launcher: ^6.2.1
  widget_marquee: ^0.0.8
  window_manager: ^0.4.2
  flutter_inappwebview: ^6.0.0
  video_player: ^2.9.1
  # NOTE: The previous git fork (Shivaay20005/youtube_explode_dart) no longer
  # exists (404), which broke fresh `flutter pub get` runs. YouTube has also
  # blocked the old extraction clients bundled with v2.3.7, so the app must
  # use the actively-maintained upstream release. Pinned exactly on purpose:
  # this package ships breaking extraction changes in minor releases.
  youtube_explode_dart: 3.1.0
  # fl_chart: ^1.1.0
  intl: ^0.20.2
  # vector_math: ^2.1.4
  # home_widget: ^0.8.1
dev_dependencies:
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  jnigen: ^0.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/fonts/
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: DancingScript
      fonts:
        - asset: assets/fonts/dancing-script.regular.ttf

# For details regarding fonts from package dependencies,
# see https://flutter.dev/custom-fonts/#from-packages

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#hex_code"
    theme_color: "#hex_code"
  windows:
    generate: true
  macos:
    generate: false

dependency_overrides:
  speech_to_text_windows:
    path: ./dummy_speech_to_text_windows
