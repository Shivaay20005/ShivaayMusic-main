name: Build Windows EXE & Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach Windows files to the matching GitHub Release'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable app & setup EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "pubspec.yaml" -Pattern '^version:\s*(.+)$'
          if (-not $versionLine) {
            throw "Version was not found in pubspec.yaml"
          }

          $fullVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          $parts = $fullVersion -split '\+'
          if ($parts.Count -ne 2) {
            throw "Invalid version '$fullVersion'. Expected x.y.z+build"
          }

          $appVersion = $parts[0]
          $buildNumber = $parts[1]
          "full=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build=$buildNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building ShivaayMusic $fullVersion for Windows"

      - name: Verify tag matches pubspec version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "${{ steps.version.outputs.tag }}") {
            throw "Git tag ${{ github.ref_name }} does not match pubspec tag ${{ steps.version.outputs.tag }}"
          }

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate localization data
        run: dart localization/generator.dart

      - name: Enable update checks in release build
        shell: pwsh
        run: |
          Set-Content -Path "lib/utils/update_check_flag_file.dart" -Value "const updateCheckFlag = true;"

      - name: Build Windows release bundle
        shell: pwsh
        run: |
          flutter build windows `
            --release `
            --build-name="${{ steps.version.outputs.name }}" `
            --build-number="${{ steps.version.outputs.build }}"

          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/shivaaymusic.exe")) {
            throw "Windows build did not produce $bundle/shivaaymusic.exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.name }}"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "windows-release"
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          # Portable package includes the EXE, Flutter DLL and the complete data
          # folder. Shipping shivaaymusic.exe by itself would not run.
          $portablePath = Join-Path $releaseDir "ShivaayMusic-v$version-Windows-Portable.zip"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $portablePath -CompressionLevel Optimal -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "windows/packaging/exe/inno_setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $generatedInstaller = "windows/packaging/exe/shivaaymusic.exe"
          if (-not (Test-Path $generatedInstaller)) {
            throw "Inno Setup did not produce $generatedInstaller"
          }
          Move-Item $generatedInstaller (Join-Path $releaseDir "ShivaayMusic-v$version-Windows-Setup.exe") -Force

          Get-ChildItem $releaseDir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File (Join-Path $releaseDir "SHA256SUMS-Windows.txt") -Append -Encoding ascii
          }
          Get-ChildItem $releaseDir | Format-Table Name, Length

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShivaayMusic-v${{ steps.version.outputs.name }}-windows
          path: windows-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows files to GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ShivaayMusic ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            windows-release/*.exe
            windows-release/*.zip
            windows-release/SHA256SUMS-Windows.txt
