name: Build Windows EXE & Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach Windows files to the matching GitHub Release'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable app & setup EXE
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # `flutter build windows` configures the project with the CMake that ships
      # inside Visual Studio (flutter_tools reads visualStudio.cmakePath), so the
      # CMake that lukka/get-cmake puts on PATH never runs the configure step.
      # That Visual Studio CMake is 4.x, and CMake 4 removed compatibility with
      # `cmake_minimum_required(VERSION <3.5)`. The Firebase C++ SDK 12.7.0 that
      # firebase_core 3.15.2 downloads still declares `cmake_minimum_required
      # (VERSION 3.1)` on line 17 of its top-level CMakeLists.txt, which aborts the
      # configure step. CMake >= 4.0 reads this environment variable as the floor
      # to apply when a project asks for an older policy version.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Kept for any tooling that resolves `cmake` from PATH. It is deliberately
      # not the CMake that builds the app; see the step below that reports the
      # Visual Studio CMake, which is the one Flutter actually invokes.
      - name: Setup CMake and Ninja on PATH
        uses: lukka/get-cmake@v4.1.1
        with:
          cmakeVersion: '~3.31.0'
          ninjaVersion: latest

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          Write-Host "CMake on PATH:"
          cmake --version

          # Report the CMake that `flutter build windows` really runs, so a
          # configure failure can be attributed to the correct toolchain version.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
            Select-Object -First 1
          if (-not $vsPath) {
            throw "Visual Studio with the MSVC toolset was not found on this runner"
          }
          $vsCMake = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          Write-Host "Visual Studio installation: $vsPath"
          if (Test-Path $vsCMake) {
            Write-Host "CMake bundled with Visual Studio (used by 'flutter build windows'):"
            & $vsCMake --version
          } else {
            Write-Host "No CMake bundled with Visual Studio at $vsCMake"
          }
          Write-Host "CMAKE_POLICY_VERSION_MINIMUM=$env:CMAKE_POLICY_VERSION_MINIMUM"

          flutter doctor -v

      - name: Enable Windows desktop and symlink support
        shell: pwsh
        run: |
          # Flutter plugins are exposed to the build through NTFS symlinks, so the
          # hosted runner has to be allowed to create them.
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          git config --global core.symlinks true
          flutter config --enable-windows-desktop

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "pubspec.yaml" -Pattern '^version:\s*(.+)$'
          if (-not $versionLine) {
            throw "Version was not found in pubspec.yaml"
          }

          $fullVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          $parts = $fullVersion -split '\+'
          if ($parts.Count -ne 2) {
            throw "Invalid version '$fullVersion'. Expected x.y.z+build"
          }

          $appVersion = $parts[0]
          $buildNumber = $parts[1]
          "full=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build=$buildNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building ShivaayMusic $fullVersion for Windows"

      - name: Verify tag matches pubspec version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "${{ steps.version.outputs.tag }}") {
            throw "Git tag ${{ github.ref_name }} does not match pubspec tag ${{ steps.version.outputs.tag }}"
          }

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate localization data
        run: dart localization/generator.dart

      # `flutter build windows` reaches every plugin through
      # windows/flutter/ephemeral/.plugin_symlinks/<plugin>. audiotags unpacks its
      # prebuilt taglib binaries with `cmake -E tar` into its own source directory,
      # and CMake's libarchive refuses to write through a symlink:
      #   CMake Error: Problem with archive_write_header():
      #   Cannot extract through symlink ...\.plugin_symlinks\audiotags
      # Downloading and unpacking the archive into the plugin's real directory in
      # the pub cache first makes both of the plugin's `if(NOT EXISTS ...)` guards
      # true, so the build never extracts through a symlink.
      - name: Pre-extract plugin native binaries outside symlinked paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageConfig = Get-Content ".dart_tool/package_config.json" -Raw | ConvertFrom-Json
          $package = $packageConfig.packages | Where-Object { $_.name -eq 'audiotags' } | Select-Object -First 1
          if (-not $package) {
            throw "audiotags is missing from .dart_tool/package_config.json"
          }

          $pluginRoot = ([Uri]$package.rootUri).LocalPath
          if (-not [System.IO.Path]::IsPathRooted($pluginRoot)) {
            $pluginRoot = Join-Path (Get-Location) $pluginRoot
          }
          $windowsDir = Join-Path $pluginRoot 'windows'
          $cmakeLists = Join-Path $windowsDir 'CMakeLists.txt'
          if (-not (Test-Path $cmakeLists)) {
            throw "Expected the audiotags Windows CMakeLists at $cmakeLists"
          }

          # Read the version and URL the plugin itself uses, so this step keeps
          # working when the plugin bumps its prebuilt binaries.
          $cmakeText = Get-Content $cmakeLists -Raw
          $versionMatch = [regex]::Match($cmakeText, 'set\(\s*Version\s+"([^"]+)"\s*\)')
          $urlMatch = [regex]::Match($cmakeText, '"(https://[^"]+\.tar\.gz)"')
          if (-not $versionMatch.Success -or -not $urlMatch.Success) {
            throw "Could not read the audiotags native binary download details from $cmakeLists"
          }
          $url = $urlMatch.Groups[1].Value -replace '\$\{Version\}', $versionMatch.Groups[1].Value

          $nativeLibrary = Join-Path $windowsDir 'audiotags.dll'
          if (Test-Path $nativeLibrary) {
            Write-Host "audiotags native binaries are already unpacked in $windowsDir"
          } else {
            $archive = Join-Path $windowsDir 'windows.tar.gz'
            if (-not (Test-Path $archive)) {
              Write-Host "Downloading audiotags native binaries from $url"
              & curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive $url
              if ($LASTEXITCODE -ne 0) {
                throw "Download failed for $url"
              }
            }
            Write-Host "Unpacking $archive into $windowsDir"
            & tar -xzf $archive -C $windowsDir
            if ($LASTEXITCODE -ne 0) {
              throw "Extraction failed for $archive"
            }
            if (-not (Test-Path $nativeLibrary)) {
              throw "Extraction of $archive did not produce $nativeLibrary"
            }
          }

          Get-ChildItem $windowsDir -File | Select-Object Name, Length | Format-Table

      - name: Enable update checks in release build
        shell: pwsh
        run: |
          Set-Content -Path "lib/utils/update_check_flag_file.dart" -Value "const updateCheckFlag = true;"

      - name: Build Windows release bundle
        shell: pwsh
        run: |
          flutter build windows `
            --release `
            --build-name="${{ steps.version.outputs.name }}" `
            --build-number="${{ steps.version.outputs.build }}" `
            2>&1 | Tee-Object -FilePath "windows-build.log"
          $buildExitCode = $LASTEXITCODE

          if ($buildExitCode -ne 0) {
            $logTail = Get-Content "windows-build.log" -Tail 300
            "## Windows build failure" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "``````text" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $logTail | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append

            # Surface useful compiler lines through the Checks API as well as
            # the downloadable full log, making failures diagnosable even when
            # the Actions log service is temporarily unavailable. CMake prints the
            # reason for a configure error on the lines *after* the error header,
            # so keep a few lines of trailing context with every match.
            $diagnostic = $logTail |
              Select-String -Pattern '(?i)(error|exception|failed|failure|cannot|undefined)' -Context 0,3 |
              Select-Object -Last 10 |
              ForEach-Object { (@($_.Line) + @($_.Context.PostContext)) -join ' ~ ' }
            if (-not $diagnostic) { $diagnostic = $logTail | Select-Object -Last 20 }
            $message = ($diagnostic -join ' | ').Trim()
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Flutter Windows compiler output::$message"
            throw "Flutter Windows build failed with exit code $buildExitCode"
          }

          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/shivaaymusic.exe")) {
            throw "Windows build did not produce $bundle/shivaaymusic.exe"
          }

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log-${{ github.run_id }}
          path: windows-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.name }}"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "windows-release"
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          # Portable package includes the EXE, Flutter DLL and the complete data
          # folder. Shipping shivaaymusic.exe by itself would not run.
          $portablePath = Join-Path $releaseDir "ShivaayMusic-v$version-Windows-Portable.zip"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $portablePath -CompressionLevel Optimal -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "windows/packaging/exe/inno_setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $generatedInstaller = "windows/packaging/exe/shivaaymusic.exe"
          if (-not (Test-Path $generatedInstaller)) {
            throw "Inno Setup did not produce $generatedInstaller"
          }
          Move-Item $generatedInstaller (Join-Path $releaseDir "ShivaayMusic-v$version-Windows-Setup.exe") -Force

          $checksumPath = Join-Path $releaseDir "ShivaayMusic-v$version-SHA256SUMS-Windows.txt"
          Get-ChildItem $releaseDir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File $checksumPath -Append -Encoding ascii
          }
          Get-ChildItem $releaseDir | Format-Table Name, Length

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShivaayMusic-v${{ steps.version.outputs.name }}-windows
          path: windows-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows files to GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ShivaayMusic ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            windows-release/*.exe
            windows-release/*.zip
            windows-release/*SHA256SUMS-Windows.txt
