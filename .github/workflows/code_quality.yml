name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0841c-shivaaymusic-main
  pull_request:
    branches:
      - main

jobs:
  build-apk:
    name: Analyze & build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Latest stable Flutter is required:
      # pubspec.lock was generated with Flutter >=3.44 (Dart >=3.12).
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter version
        run: |
          flutter --version | tee flutter_version.log

      - name: Install packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pubget.log

      - name: Linter
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log
          flutter build appbundle --release 2>&1 | tee -a build.log

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: shivaaymusic-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload split APKs (per device CPU)
        uses: actions/upload-artifact@v4
        with:
          name: shivaaymusic-apk-split-per-abi
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: shivaaymusic-aab
          path: build/app/outputs/bundle/release/app-release.aab
