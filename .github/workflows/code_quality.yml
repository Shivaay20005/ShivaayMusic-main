name: Build Android APK & Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub tag and Release from this branch'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

# A new push cancels an older build for the same branch, saving Actions minutes.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Analyze, build & publish Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          APP_VERSION="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          if [[ -z "$APP_VERSION" || "$FULL_VERSION" == "$APP_VERSION" ]]; then
            echo "Invalid pubspec version: $FULL_VERSION (expected x.y.z+build)" >&2
            exit 1
          fi
          echo "full=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ShivaayMusic $FULL_VERSION"

      - name: Show Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Analyze source
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee flutter-analyze.log
          analyze_status=${PIPESTATUS[0]}
          if [[ $analyze_status -ne 0 ]]; then
            diagnostics="$(grep -Ei '(^|[ •])(error|exception|failed|undefined|isn.t defined)' flutter-analyze.log | tail -n 30 | tr '\n' ' ')"
            diagnostics="${diagnostics//'%'/'%25'}"
            diagnostics="${diagnostics//$'\r'/'%0D'}"
            diagnostics="${diagnostics//$'\n'/'%0A'}"
            echo "::error title=Flutter analyzer output::$diagnostics"
            exit "$analyze_status"
          fi

      - name: Build universal and architecture APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.build }}"
          flutter build apk \
            --release \
            --split-per-abi \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.build }}"

          mkdir -p release-apks
          VERSION="${{ steps.version.outputs.name }}"
          SOURCE_DIR="build/app/outputs/flutter-apk"

          cp "$SOURCE_DIR/app-release.apk" \
            "release-apks/ShivaayMusic-v${VERSION}-Android-Universal.apk"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "$SOURCE_DIR/app-${ABI}-release.apk" \
              "release-apks/ShivaayMusic-v${VERSION}-Android-${ABI}.apk"
          done

          test -n "$(find release-apks -maxdepth 1 -type f -name 'ShivaayMusic-v*.apk' -print -quit)"
          (
            cd release-apks
            sha256sum ShivaayMusic-v*.apk > \
              "ShivaayMusic-v${VERSION}-SHA256SUMS-Android.txt"
          )
          echo "Release files:"
          ls -lh release-apks

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShivaayMusic-v${{ steps.version.outputs.name }}-android
          path: release-apks/*
          if-no-files-found: error
          retention-days: 30

      - name: Decide whether to publish a Release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_MANUALLY: ${{ inputs.publish_release || false }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          SHOULD_PUBLISH=false

          # A matching version-tag push publishes that exact tested commit.
          # Normal branch pushes publish only after landing on the default
          # branch. A manual run can explicitly publish a selected branch.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            if [[ "${{ github.ref_name }}" != "$RELEASE_TAG" ]]; then
              echo "Tag ${{ github.ref_name }} does not match pubspec version $RELEASE_TAG" >&2
              exit 1
            fi
            SHOULD_PUBLISH=true
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "$DEFAULT_BRANCH" ]]; then
            SHOULD_PUBLISH=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "$PUBLISH_MANUALLY" == "true" ]]; then
            SHOULD_PUBLISH=true
          fi

          # Existing tags are expected for tag-triggered runs. For branch/manual
          # publishing, never move or overwrite an existing version tag.
          if [[ "$SHOULD_PUBLISH" == "true" && "${{ github.ref_type }}" != "tag" ]] && \
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Bump pubspec.yaml before publishing another release."
            SHOULD_PUBLISH=false
          fi

          echo "publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Create version tag and GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ShivaayMusic ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          files: |
            release-apks/ShivaayMusic-v*.apk
            release-apks/ShivaayMusic-v*-SHA256SUMS-Android.txt
